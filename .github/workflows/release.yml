# Creates a GitHub release with main.js, manifest.json and styles.css when a version tag
# (e.g. 0.1.0, matching manifest.json) is pushed. BRAT installs the plugin from these releases.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "Claude Research $GITHUB_REF_NAME" \
            --notes "Installation: siehe README. Für BRAT einfach dieses Repository hinzufügen."
